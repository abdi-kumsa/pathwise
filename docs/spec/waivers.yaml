# Wave 8/9 — product caveats, not missing widgets.
#
# Spec coverage is 259/259. These entries record residual honesty limits so they
# cannot be mistaken for unfinished DOC1/DOC2 rows. A waiver MUST NOT name a
# missing widget, component, or endpoint.
#
# tests/test_spec_coverage.py::test_waivers_are_caveats_not_coverage_holes

waivers:
  - id: WV.US1
    caveat: >-
      Placement XGBoost, salary XGBoost, US LSTM enrolment and Prophet demand
      artefacts remain on disk. They are not Ethiopia Model 1 or Model 2 scores,
      and the 2026-11-07 audit found each loses to a trivial baseline. Since
      Phase 1 their routes (/api/market, /api/enrollment, /api/recommendations
      and the /student/evaluator, /student/salary, /student/market,
      /university/enrollment pages) are registered only when LEGACY_US_MODELS=1
      and VITE_LEGACY_US_MODELS=true. The default deployment does not load them.
    retires_when: >-
      Those tool routes are removed or the artefacts are retrained on Ethiopia
      fact tables and labelled as such.
    does_not_excuse: widgets

  - id: WV.SIM1
    caveat: >-
      Every Ethiopia figure is provenance.tier simulated until official CSA,
      MoE or ESS files replace the parquets under docs/spec/ingestion/.
    retires_when: An official file is ingested for a table and that series is
      restamped tier official.
    does_not_excuse: widgets

# WV.OLS1 retired 2026-11-08 (Phase 2): the near-zero ols_lags RMSE came from
# lag columns that leaked the target. The generator now publishes true lags,
# ols_lags is replaced by a four-candidate rolling-origin backtest, and every
# candidate's error is non-zero. "Simulated errors are not ministry accuracy"
# remains, under WV.SIM1.
