[pytest]
testpaths = tests
pythonpath = .
markers =
    integrity: the spec registry is well formed
    honesty: client-agreed constraints that must hold from day one
    coverage: burn-down until Waves 1-7 land; red is a to-do, not a regression
    live: needs the running API at BASE_URL (applied in tests/conftest.py)
    legacy: leftover US model artefacts; needs TensorFlow / Prophet / XGBoost / SHAP
