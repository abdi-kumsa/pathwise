# PathWise CI — runs on every push and pull request.
#
#   lint-and-unit   ruff + root unit tests + backend unit tests  (no Docker)
#   frontend        oxlint + vitest + production build + bundle checks
#   audit           pip-audit and npm audit on runtime dependencies
#   live            full stack via docker compose, then the live suites
#
# To make `main` require these checks: GitHub → Settings → Branches → Add rule
# for `main` → "Require status checks to pass" → select the four jobs below.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minor version only: runners carry the current 3.11.x patch, and an exact
  # patch pin (3.11.9) was not available on Ubuntu 26.04. Render pins the
  # patch separately in .python-version.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  lint-and-unit:
    name: Python lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENV: test
      LEGACY_US_MODELS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff
      - name: Ruff (bugs, not style — see ruff.toml)
        run: ruff check backend ml tests scripts
      - name: Root unit tests (no live API, no legacy artefacts)
        run: pytest -m "not live and not legacy" -q
      - name: Backend unit tests
        working-directory: backend
        run: pytest -m "not live" -q
      - name: API route table in docs/TECHNICAL.md is current
        run: python scripts/gen_route_table.py --check
      - name: Model comparison and importance docs match the models
        run: python scripts/model_report.py --check
      - name: Model artefacts match their SHA-256 manifest
        run: python scripts/artifact_manifest.py --check

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npx vitest run
      - name: Production build
        run: npx vite build
      - name: Demo password and legacy pages are not shipped
        run: |
          if grep -R "pathwise123" dist/; then
            echo "::error::demo password found in the production bundle"; exit 1
          fi
          # Strings only the four leftover US-model pages render. Component
          # names are minified away, so check for their visible text instead.
          if grep -R -l "Student evaluator\|Salary forecast\|predict-placement" dist/; then
            echo "::error::legacy US-model pages are in the default build"; exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit (runtime requirements)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
      - name: npm audit (runtime dependencies, high and above)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  live:
    name: Live API suites (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" >> .env
      - name: Start the stack
        run: docker compose up -d --build db backend
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 5
          done
          docker compose logs backend; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: pip install -r backend/requirements.txt
      - name: Root live suites
        env:
          BASE_URL: http://127.0.0.1:8000
        run: pytest -m live -q
      - name: Backend live suite
        run: docker compose exec -T backend python -m pytest -m live -q
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend
