services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pathwise_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # HOST:CONTAINER. Only the host side is configurable — the container always
      # listens on 5432, which is what the backend dials via DATABASE_URL.
      # Override DB_HOST_PORT in .env when another Postgres already owns 5432.
      # Bound to localhost: the database is reachable from this machine only,
      # not from the network. Set BIND_ADDRESS=0.0.0.0 to change that.
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount schema so Postgres runs it automatically on first-ever container
      # start (when the data volume is empty). Skipped on every subsequent start.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
      args:
        # 1 also installs requirements-legacy.txt (TensorFlow, Prophet, ...).
        LEGACY_US_MODELS: ${LEGACY_US_MODELS:-0}
    container_name: pathwise_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    # Default (BACKEND_RELOAD unset) runs without uvicorn's file watcher.
    # The watcher is unreliable on Windows bind mounts — it crash-loops with
    # "WatchfilesRustInternalError: IO error for operation on /app" and leaves
    # the API up but with no models loaded. Set BACKEND_RELOAD=--reload in .env
    # while actively editing backend code; otherwise use
    # `docker compose restart backend` to pick up changes.
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 ${BACKEND_RELOAD:-}"
    volumes:
      - ./backend:/app
      - ./ml:/ml
      - ./data:/data
      - ./docs:/docs
      - ./Assets:/Assets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl is installed in Dockerfile.backend.
      # start_period gives TF/Prophet time to load before retries begin.
      # NOTE: this gates on the API being *reachable*, not on every model
      # having loaded — `"status":` matches both "ok" and "degraded", so the
      # frontend will start even if some models failed. That is deliberate:
      # a missing artefact degrades individual endpoints rather than taking
      # the whole stack down. To gate strictly on all models, change the
      # pattern to '"status":"ok"'.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -q '\"status\":' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: pathwise_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # The browser resolves this, so it must be the HOST port, not API_PORT
      # (which is the port uvicorn listens on inside the container).
      VITE_API_URL: http://localhost:${API_HOST_PORT:-8000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
