version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pathwise_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount schema so Postgres runs it automatically on first-ever container
      # start (when the data volume is empty). Skipped on every subsequent start.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: pathwise_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
      - ./data:/data
      - ./Assets:/Assets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl is installed in Dockerfile.backend.
      # start_period gives TF/Prophet time to load before retries begin.
      # The frontend depends_on this healthcheck so it won't start until
      # all models report loaded.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -q '\"status\":' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: pathwise_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:${API_PORT}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
