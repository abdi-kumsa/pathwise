# NOTE: no `databases:` block — Render allows one free-tier Postgres per
# account and this one is shared with another project. DATABASE_URL is set
# manually on the backend service and points at that existing instance, with
# ?options=-csearch_path%3Dpathwise so every table PathWise creates lands in
# its own `pathwise` schema rather than `public`. See docs/RENDER_DEPLOYMENT.md.

services:

  # FastAPI Backend
  - type: web
    name: pathwise-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Internal connection string of the shared Postgres instance, with a
      # search_path pointing at the dedicated `pathwise` schema.
      - key: DATABASE_URL
        sync: false
      - key: API_HOST
        value: 0.0.0.0
      # Comma-separated CORS allowlist read by main.py. Must be the exact
      # frontend origin, no trailing slash.
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: DEMO_PASSWORD
        value: pathwise123
    healthCheckPath: /health

  # React Frontend (Static Site)
  - type: web
    name: pathwise-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
