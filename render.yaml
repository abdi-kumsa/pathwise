# NOTE: no `databases:` block — Render allows one free-tier Postgres per
# account and this one is shared with another project. DATABASE_URL is set
# manually on the backend service and points at that existing instance, with
# ?options=-csearch_path%3Dpathwise so every table PathWise creates lands in
# its own `pathwise` schema rather than `public`.

services:

  # FastAPI Backend
  - type: web
    name: pathwise-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Internal connection string of the shared Postgres instance, with a
      # search_path pointing at the dedicated `pathwise` schema.
      - key: DATABASE_URL
        sync: false
      - key: API_HOST
        value: 0.0.0.0
      # Comma-separated CORS allowlist read by main.py. Must be the exact
      # frontend origin, no trailing slash.
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # 8 hours. Role and institution live in the token, so a long lifetime
      # delays every permission change by the same amount.
      - key: JWT_EXPIRE_MINUTES
        value: 480
      # Seeded once into an empty users table. Set a strong value in the Render
      # dashboard; never commit it. Rotating it later does not change accounts
      # that already exist: reset those through the admin console.
      - key: DEMO_PASSWORD
        sync: false
      # Startup refuses a missing or short JWT_SECRET unless ENV=dev.
      - key: ENV
        value: production
      # Render's proxy appends the real client IP to X-Forwarded-For; the rate
      # limiter reads that hop instead of the proxy's own address.
      - key: TRUST_PROXY
        value: "1"
    healthCheckPath: /health

  # React Frontend (Static Site)
  - type: web
    name: pathwise-frontend
    runtime: static
    # npm ci installs exactly what package-lock.json pins.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Vite 8 needs Node 20.19+ or 22.12+.
      - key: NODE_VERSION
        value: 22.21.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Same policy as docker/nginx/security-headers.inc.template. connect-src
    # allows the Render API host; narrow it to the exact origin once known.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
